<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mi Agenda Gym</title><style>
body{font-family:-apple-system,system-ui,sans-serif;background:#f4f6f9;padding:20px;margin:0;color:#333;padding-top:75px}.container{max-width:650px;margin:0 auto}.card{background:#fff;padding:25px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.08);margin-bottom:25px}.header-flotante{position:fixed;top:0;left:0;right:0;background:#1a365d;z-index:1000;box-shadow:0 2px 10px rgba(0,0,0,.2);padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px}.nav-meses{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex-grow:1}.nav-meses::-webkit-scrollbar{display:none}.nav-btn{background:#2b6cb0;color:#fff;border:none;padding:7px 14px;border-radius:20px;font-size:.75rem;font-weight:700;cursor:pointer;white-space:nowrap}.btn-ajustes{background:#319795;color:#fff;border:none;padding:7px 14px;border-radius:20px;font-size:.75rem;font-weight:700;cursor:pointer;white-space:nowrap}.sidebar{position:fixed;top:0;right:-320px;width:280px;height:100%;background:#fff;z-index:2000;box-shadow:-4px 0 15px rgba(0,0,0,.15);transition:right .3s ease;padding:20px;overflow-y:auto}.sidebar.open{right:0}.sidebar-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:1999;display:none}.sidebar-overlay.open{display:block}.sidebar h2{color:#1a365d;font-size:1.3rem;margin-top:0;border-bottom:2px solid #edf2f7;padding-bottom:10px}.sidebar-seccion{margin-bottom:20px}.sidebar-seccion h3{font-size:.85rem;color:#4a5568;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}.opcion-check{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:.9rem;cursor:pointer}select{width:100%;padding:8px;border-radius:6px;border:1px solid #cbd5e0;font-size:.9rem;background:#fff}.btn-guardar-ajustes{width:100%;background:#38a169;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:700;font-size:.95rem;cursor:pointer;margin-top:15px}.mes-title{background:#2b6cb0;color:#fff;padding:10px 15px;border-radius:8px;font-weight:700;font-size:1.1rem;margin-top:30px;margin-bottom:12px;scroll-margin-top:85px}.clase-row{display:flex;flex-direction:column;padding:14px;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:10px;background:#fff}.meta{display:flex;justify-content:space-between;align-items:center;font-size:.95rem;margin-bottom:6px}.fecha-texto{font-weight:700;color:#2d3748}.disciplina-texto{font-weight:700;color:#4a5568;font-size:.9rem}.alerta{color:#c53030;font-weight:600;font-size:.85rem;background:rgba(197,48,48,.05);padding:4px 8px;border-radius:4px;display:inline-block;margin-bottom:10px}.btn-group{display:flex;gap:8px;flex-wrap:wrap}.btn-group button{flex:1;min-width:100px;padding:10px;border:1px solid #cbd5e0;border-radius:8px;background:#edf2f7;cursor:pointer;font-size:.85rem;font-weight:600}button.active-r{background:#3182ce;color:#fff;border-color:#2b6cb0}button.active-a{background:#38a169;color:#fff;border-color:#2f855a}.btn-cal{background:#e2e8f0;color:#1a365d;border-color:#cbd5e0;display:flex;align-items:center;justify-content:center;gap:4px;text-decoration:none;text-align:center;font-size:.85rem;font-weight:600;border-radius:8px}
</style></head><body>
<div class="header-flotante"><div class="nav-meses" id="menuNavegacion"></div><button class="btn-ajustes" onclick="toggleSidebar(true)">⚙️ Ajustes</button></div>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>
<div class="sidebar" id="sidebarAjustes"><h2>Ajustes de Preferencias</h2><div class="sidebar-seccion"><h3>Tarifa Mensual</h3><select id="ajusteTarifa"><option value="9">9 Clases al mes</option><option value="10">10 Clases al mes</option><option value="11">11 Clases al mes</option><option value="12">12 Clases al mes</option><option value="999">Sin Límite</option></select></div><div class="sidebar-seccion"><h3>Horario Preferente</h3><select id="ajusteHorario"><option value="todas">Todos los horarios</option><option value="14:30">Mediodía (14:30)</option><option value="17:45">Tarde Temprana (17:45)</option><option value="19:45">Tarde Noche (19:45)</option></select></div><div class="sidebar-seccion"><h3>Días Disponibles</h3><div id="contenedorDias"></div></div><div class="sidebar-seccion"><h3>Disciplinas Activas</h3><div id="contenedorDisciplinas"></div></div><button class="btn-guardar-ajustes" onclick="guardarNuevosAjustes()">Aplicar Cambios</button></div>
<div class="container"><div class="card"><div id="contenido"></div></div></div>
<script>
const festivos=["2026-10-12","2026-11-02","2026-11-09","2026-12-07","2026-12-08","2026-12-25","2027-01-01","2027-01-06","2027-03-25","2027-03-26","2027-05-01","2027-05-03","2027-05-15","2027-08-15","2027-10-12","2027-11-01","2027-11-09","2027-12-06","2027-12-08","2027-12-25"];
const nombresMeses=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const diasSemana=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const codigosDias=["Lunes","Martes","Miércoles","Jueves","Viernes"];
const HORARIOS_TCENTER={1:{"10:00":"Híbrido","10:30":"Kettlebells","14:30":"5x5","15:30":"T Trail","16:45":"5x5","17:45":"Vinsaya Yoga","18:45":"Clubbel","19:45":"Kettlebells"},2:{"07:15":"Clubbel","10:00":"Vinsaya Yoga","10:30":"T Race","11:00":"TMov Skills","13:00":"Formaciones","14:30":"Clubbel","16:45":"Pilates","17:45":"Pilates","18:45":"Flowing ground","19:45":"Clubbel","20:00":"T Race","20:45":"Clubbel"},3:{"07:15":"TMov Skills","10:00":"Landmine","10:30":"TMov Skills","11:00":"Endurance","14:30":"TMov Skills","15:00":"T Trail","17:45":"Kettlebells","18:45":"TMov Ground","19:45":"Bodyweight","20:00":"T Race","20:45":"Clubbel"},4:{"07:15":"5x5","10:00":"Híbrido","10:30":"TM20","14:30":"Híbrido","16:45":"Vinsaya Yoga","17:00":"Formaciones","17:45":"Bodyweight","18:45":"T Run Técnica","19:45":"TMov Ground","20:45":"Bodyweight"},5:{"10:00":"TMov Ground","10:30":"Bodyweight","11:00":"Pilates","14:30":"TM20","16:45":"Clubbel","17:45":"5x5","18:45":"TMov Skills","19:45":"Clubbel"}};
const TODAS_DISCIPLINAS=["Kettlebells","Bodyweight","Clubbel","Pilates","Híbrido","Flowing ground","TM20","TMov Ground","TMov Skills","Landmine","Fundamentos","Endurance","5x5","T Trail","T Run Técnica","T Race","Vinsaya Yoga"];
let preferenciasUsuario={tarifa:"9",horarioPreferente:"19:45",diasSeleccionados:[1,3,5],disciplinasActivas:["Kettlebells","Bodyweight","Clubbel"]};
if(localStorage.getItem('tc_pref_app_v5')){preferenciasUsuario=JSON.parse(localStorage.getItem('tc_pref_app_v5'))}
function toggleSidebar(e){document.getElementById('sidebarAjustes').classList.toggle('open',e);document.getElementById('sidebarOverlay').classList.toggle('open',e)}
let historialClases=JSON.parse(localStorage.getItem('tc_historial_v5'))||{};
function saveEstadoHistorial(e,t,a){if(!historialClases[e])historialClases[e]={r:!1,a:!1};historialClases[e][t]=a;localStorage.setItem('tc_historial_v5',JSON.stringify(historialClases))}
function pintarPanelAjustes(){document.getElementById('ajusteTarifa').value=preferenciasUsuario.tarifa;document.getElementById('ajusteHorario').value=preferenciasUsuario.horarioPreferente;const e=document.getElementById('contenedorDias');let t='';codigosDias.forEach(((e,a)=>{const n=a+1,l=preferenciasUsuario.diasSeleccionados.includes(n)?'checked':'';t+=`<label class="opcion-check"><input type="checkbox" value="${n}" class="chk-dia" ${l}> ${e}</label>`}));e.innerHTML=t;const a=document.getElementById('contenedorDisciplinas');let n='';TODAS_DISCIPLINAS.forEach(((e)=>{const t=preferenciasUsuario.disciplinasActivas.includes(e)?'checked':'';n+=`<label class="opcion-check"><input type="checkbox" value="${e}" class="chk-disc" ${t}> <span>${e}</span></label>`}));a.innerHTML=n}
window.guardarNuevosAjustes=function(){let e=[];document.querySelectorAll('.chk-dia:checked').forEach((t=>e.push(parseInt(t.value))));let t=[];document.querySelectorAll('.chk-disc:checked').forEach((e=>t.push(e.value)));if(0===e.length||0===t.length){alert("⚠️ Selecciona al menos un día y una disciplina activa.");return}preferenciasUsuario.tarifa=document.getElementById('ajusteTarifa').value;preferenciasUsuario.horarioPreferente=document.getElementById('ajusteHorario').value;preferenciasUsuario.diasSeleccionados=e;preferenciasUsuario.disciplinasActivas=t;localStorage.setItem('tc_pref_app_v5',JSON.stringify(preferenciasUsuario));calcularYRenderizarAgenda();toggleSidebar(!1)};
function calcularYRenderizarAgenda(){let e=[],t=new Date(2026,8,14),a=new Date(2027,11,31),n=parseInt(preferenciasUsuario.tarifa),l=new Date(t);while(l<=a){let t=l.getDay(),s=l.toISOString().split("T")[0];if(preferenciasUsuario.diasSeleccionados.includes(t)&&!festivos.includes(s)){let t=HORARIOS_TCENTER[t]||{},o="";o=preferenciasUsuario.horarioPreferente!=="todas"&&t[preferenciasUsuario.horarioPreferente]?preferenciasUsuario.horarioPreferente:Object.keys(t)[Object.keys(t).length-1];if(o){let r=t[o];if(preferenciasUsuario.disciplinasActivas.includes(r)){let t=e.filter((e=>e.mes==`${nombresMeses[l.getMonth()]} ${l.getFullYear()}`)).length;if(t<n){let t=new Date(l);t.setHours(t.getHours()-48);let o=`${diasSemana[t.getDay()]} ${String(t.getDate()).padStart(2,"0")}/${String(t.getMonth()+1).padStart(2,"0")}/${t.getFullYear()} a las ${s}`,i=String(l.getFullYear()).substring(2),c=`${nombresMeses[l.getMonth()].substring(0,3)} '${i}`,g=`c_${s.replace(/-/g,"")}`;e.push({id:g,mes:`${nombresMeses[l.getMonth()]} ${l.getFullYear()}`,slugMes:`mes_${l.getMonth()}_${l.getFullYear()}`,btnTexto:c,fecha:`${diasSemana[l.getDay()]} ${String(l.getDate()).padStart(2,"0")}/${String(l.getMonth()+1).padStart(2,"0")}/${l.getFullYear()}`,diaMes:String(l.getDate()).padStart(2,"0"),numMes:String(l.getMonth()+1).padStart(2,"0"),tipo:r,hora:o,reserva:o,semana:Math.floor(t/3),objetoFechaReserva:new Date(t)})}}}}l.setDate(l.getDate()+1)}dibujarAgendaPantalla(e)}
function dibujarAgendaPantalla(e){const t=document.getElementById("contenido"),a=document.getElementById("menuNavegacion");let n="",l="",s="",r=new Set;if(0===e.length){t.innerHTML='<div style="text-align:center;padding:40px;color:#718096;font-weight:600;">⚠️ Ninguna clase del horario del centro coincide con tus ajustes actuales. Abre Ajustes y revisa tus opciones.</div>';a.innerHTML="";return}e.forEach((e=>{if(e.mes!==s){s=e.mes;n+=`<div class="mes-title" id="${e.slugMes}">${s}</div>`;if(!r.has(e.mes)){r.add(e.mes);l+=`<button class="nav-btn" onclick="document.getElementById('${e.slugMes}').scrollIntoView({behavior:'smooth'});">${e.btnTexto}</button>`}}const a=historialClases[e.id]||{r:!1,a:!1};let o="🏋️";"Bodyweight"===e.tipo&&(o="🤸");"Clubbel"===e.tipo&&(o="🪓");n+=`<div class="clase-row sem-${e.semana}"><div class="meta"><span class="fecha-texto">${o} ${e.fecha} — ${e.hora}h</span><span class="disciplina-texto">${e.tipo}</span></div><div><span class="alerta">⏰ Apertura reserva: ${e.reserva}</span></div><div class="btn-group"><button class="${a.r?"active-r":""}" onclick="toggleClase('${e.id}','r')">${a.r?"🔷 Reservada":"⬜ Reservar"}</button><button class="${a.a?"active-a":""}" onclick="toggleClase('${e.id}','a')">${a.a?"✅ Asistida":"⬜ Asistir"}</button><button class="btn-cal" onclick="dispararDobleRafagaIcs('${e.fecha}','${e.tipo}','${e.diaMes}','${e.numMes}','${e.objetoFechaReserva.toISOString()}')">Alarma 48h</button></div></div>`}));t.innerHTML=n;a.innerHTML=l}
window.toggleClase=function(e,t){if(!historialClases[e])historialClases[e]={r:!1,a:!1};historialClases[e][t]=!historialClases[e][t];saveEstadoHistorial(e,t,historialClases[e][t]);calcularYRenderizarAgenda()};
window.dispararDobleRafagaIcs=function(e,t,a,n,l){const s=new Date(l),r=e=>String(e).padStart(2,"0"),d=s.getUTCFullYear(),o=r(s.getUTCMonth()+1),i=r(s.getUTCDate()),c=r(s.getUTCHours()),g=r(s.getUTCMinutes()),p=`${d}${o}${i}T${c}${g}00Z`,u=`${d}${o}${i}T${cshortcut=r(s.getUTCMinutes()+15)}00Z`,m=["BEGIN:VCALENDAR","VERSION:2.0","BEGIN:VEVENT",`DTSTART:${p}`,`DTEND:${p}`,`SUMMARY:RESERVAR ${t.toUpperCase()} TCENTER`,`DESCRIPTION:Abrir app para reservar clase del ${e}`,"BEGIN:VALARM","TRIGGER:-PT0M","ACTION:DISPLAY","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n"),f=new Blob([m],{type:"text/calendar;charset=utf-8;"}),b=`reserva_${t.toLowerCase().replace(/ /g,"")}_${a}_${n}.ics`;inyectarEnlaceDescarga(f,b);setTimeout((function(){inyectarEnlaceDescarga(f,b)}),100)};
function inyectarEnlaceDescarga(e,t){const a=document.createElement("a");a.href=URL.createObjectURL(e);a.download=t;document.body.appendChild(a);a.click();document.body.removeChild(a)}
pintarPanelAjustes();calcularYRenderizarAgenda();
</script></body></html>
